<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Words" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="英語の基礎暗記と公共の一問一答に対応した定期テスト対策アプリ"
    />
    <title>Words — 英語・公共対策</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/app-icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/app-icon-192.png" sizes="192x192" type="image/png" />
    <!-- iOS のホーム画面アイコンは PNG のみ。SVG だと画面の写しが使われてしまう。 -->
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <script>
      // 画面が描かれる前に明るさを決めて、起動直後の白いちらつきを防ぐ。
      // 保存済みの設定はIndexedDBにもあるが、ここでは同期的に読めるlocalStorageを使う。
      (function () {
        try {
          var saved = localStorage.getItem("words:theme-preference");
          var preference = ["system", "light", "dark"].indexOf(saved) >= 0 ? saved : "system";
          var dark = preference === "dark"
            || (preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.dataset.themePreference = preference;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0b0b0d" : "#ffffff");
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="./styles.css?v=2026.11.20" />
    <link rel="stylesheet" href="./kobun.css?v=2026.11.20" />
  </head>
  <body>
    <div class="fx-backdrop" id="fx-backdrop" aria-hidden="true">
      <span class="fx-aurora"></span>
      <span class="fx-orbit"></span>
      <span class="fx-motes"></span>
      <span class="fx-grid"></span>
    </div>

    <div class="app-shell" id="app-shell" aria-busy="true">
      <header class="app-header" id="app-header">
        <!-- ロゴはいつでもホームへ戻る入口。 -->
        <button class="brand" type="button" data-view-target="dashboard" aria-label="ホームへ">
          <span class="brand-mark" aria-hidden="true">W</span>
          <span class="brand-name">Words</span>
        </button>
        <div class="header-actions">
          <div class="header-status" id="header-status">読み込み中</div>
          <!-- 開いている画面のボタンをもう一度押すと、ホームへ戻る。 -->
          <button class="header-round-button" id="nav-list-button" type="button" data-view-target="list" data-header-toggle>
            <svg class="header-icon-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10.4 5.3 8.2 4.8 3.5 5v13c4.7-.2 6.9.3 8.5 1.5 1.6-1.2 3.8-1.7 8.5-1.5V5c-4.7-.2-6.9.3-8.5 1.5z" /><path d="M12 6.5v13" /></svg>
            <svg class="header-icon-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" /></svg>
            <span class="sr-only" id="nav-list-label">単語帳</span>
          </button>
          <button class="header-round-button" type="button" data-view-target="history" data-header-toggle>
            <svg class="header-icon-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6" /><path d="M3.5 4.5V9H8" /><path d="M12 7.5V12l3 2" /></svg>
            <svg class="header-icon-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" /></svg>
            <span class="sr-only">テストの履歴</span>
          </button>
          <button class="header-round-button" type="button" data-view-target="settings" data-header-toggle>
            <svg class="header-icon-open" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
            <svg class="header-icon-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" /></svg>
            <span class="sr-only">設定</span>
          </button>
        </div>
      </header>

      <main class="main-content">
        <!-- 学習する回。選べる回が1つだけのときは自動で選ぶので、この画面は出ない。 -->
        <section class="view entry-view" id="view-period" data-view="period" hidden>
          <div class="entry-card period-card">
            <span class="entry-mark" aria-hidden="true">W</span>
            <p class="eyebrow">定期テスト対策</p>
            <h1>学習する回を選ぶ</h1>
            <p>最初に一度だけ選択します。次回からは自動で進みます。</p>
            <button class="period-button" type="button" data-period="2026.3">
              <span>2026.3</span><small>3定</small><strong aria-hidden="true">→</strong>
            </button>
            <!-- 2定は学習を終えたので選べないように隠す。戻すときは hidden を外し、
                 app.js の AVAILABLE_PERIODS に "2026.2" を足す。 -->
            <button class="period-button" type="button" data-period="2026.2" hidden>
              <span>2026.2</span><small>2学期</small><strong aria-hidden="true">→</strong>
            </button>
          </div>
        </section>

        <!-- 教科の一覧。ふだんはホーム上部のタブで切り替えるので、古文から戻るときに使う。 -->
        <section class="view entry-view" id="view-subject" data-view="subject" hidden>
          <div class="entry-card subject-card">
            <p class="eyebrow" id="subject-period-label">2026.3</p>
            <h1>教科を選ぶ</h1>
            <div class="subject-grid">
              <button class="subject-button english" type="button" data-subject="english">
                <span class="subject-icon" aria-hidden="true">Aa</span>
                <span><strong>英語</strong><small>単語・熟語・語法</small></span>
                <span aria-hidden="true">›</span>
              </button>
              <button class="subject-button public" type="button" data-subject="public">
                <span class="subject-icon" aria-hidden="true">公</span>
                <span><strong>公共</strong><small>一問一答</small></span>
                <span aria-hidden="true">›</span>
              </button>
              <!-- 3定では英語と公共だけを学習する。保健・古文は隠しておき、使うときに hidden を外し、
                   app.js の PERIOD_SUBJECTS にも足す。 -->
              <button class="subject-button health" type="button" data-subject="health" hidden>
                <span class="subject-icon" aria-hidden="true">保</span>
                <span><strong>保健</strong><small>一問一答 282問</small></span>
                <span aria-hidden="true">›</span>
              </button>
              <button class="subject-button kobun" type="button" data-subject="kobun" hidden>
                <span class="subject-icon" aria-hidden="true">古</span>
                <span><strong>古文</strong><small>助動詞・古文単語360語句</small></span>
                <span aria-hidden="true">›</span>
              </button>
            </div>
          </div>
        </section>

        <section class="view kobun-view" id="view-kobun" data-view="kobun" aria-label="古文学習" hidden></section>

        <!-- ホーム。教科と「演習｜テスト」の切り替え → 続きから（演習のみ） → 範囲、の順に上から並べる。 -->
        <section class="view home-view" id="view-dashboard" data-view="dashboard" hidden>
          <div class="home-tabs-row">
            <nav class="subject-tabs" id="subject-tabs" aria-label="教科"></nav>
            <div class="segment-switch mode-switch" id="mode-switch" role="radiogroup" aria-label="演習とテストの切り替え" data-mode="practice" style="--count:2;--index:0">
              <span class="segment-thumb" aria-hidden="true"></span>
              <button type="button" role="radio" aria-checked="true" data-home-mode="practice">演習</button>
              <button type="button" role="radio" aria-checked="false" data-home-mode="test">テスト</button>
            </div>
          </div>
          <p class="home-summary" id="home-summary"></p>
          <!-- 演習：続きから → 範囲（1つ）→ 形式 → 学習の準備。 -->
          <div class="home-pane" id="home-pane">
            <div class="home-continue" id="home-continue"></div>
            <div class="section-head">
              <h2 id="dashboard-title">範囲を選ぶ</h2>
              <span class="section-note" id="dashboard-copy"></span>
            </div>
            <div class="range-choice-list" id="dashboard-range-list"></div>
          </div>
          <!-- テスト：範囲・形式・重要度をこの1画面でチェックして、そのまま始める。 -->
          <div class="home-pane test-home" id="test-home" hidden></div>
        </section>

        <!-- 範囲を選んだあとの、出題形式ごとの現在地。 -->
        <section class="view range-detail-view compact-step-view" id="view-range-detail" data-view="range-detail" hidden>
          <div class="page-heading compact-step-heading">
            <div class="step-heading-row">
              <button class="icon-button step-back" type="button" data-view-target="dashboard" aria-label="範囲を選び直す">←</button>
              <h1 id="range-detail-title">範囲</h1>
              <span class="step-heading-note" id="range-detail-copy"></span>
            </div>
          </div>
          <div id="range-detail-groups"></div>
        </section>

        <!-- 学習の準備（演習）。重要度（1つ）と並び順を選び、下のボタンで始める。 -->
        <section class="view setup-view compact-step-view" id="view-study-setup" data-view="study-setup" hidden>
          <div class="page-heading compact-step-heading">
            <div class="step-heading-row">
              <button class="icon-button step-back" type="button" data-view-target="range-detail" aria-label="形式を選び直す">←</button>
              <h1 id="setup-title">学習の準備</h1>
              <span class="step-heading-note" id="setup-note"></span>
            </div>
          </div>
          <div class="setup-progress" id="setup-progress"></div>
          <div class="setup-groups" id="setup-groups"></div>
          <div class="sticky-action setup-start-bar">
            <button class="primary-button setup-start" id="setup-start" type="button" data-setup-start>スタート</button>
          </div>
        </section>

        <section class="view list-view" id="view-list" data-view="list" hidden>
          <div class="page-heading list-heading">
            <p class="eyebrow" id="list-eyebrow">WORD BOOK</p>
            <h1 id="list-title">単語帳</h1>
          </div>
          <div class="list-toolbar">
            <label class="search-field">
              <span aria-hidden="true">⌕</span>
              <input id="list-search" type="search" placeholder="英語・日本語で検索" autocomplete="off" enterkeyhint="search" />
            </label>
          </div>
          <div class="list-count" id="list-count"></div>
          <div class="word-list" id="word-list"></div>
          <button class="secondary-button load-more" id="load-more" type="button" hidden>さらに表示</button>
        </section>

        <section class="view health-notes-view" id="view-health-notes" data-view="health-notes" hidden>
          <iframe
            class="health-notes-frame"
            id="health-notes-frame"
            src="./health-notes.html?v=2026.9.39"
            title="保健 要点まとめ・知識つながりノート"
            loading="lazy"
          ></iframe>
        </section>

        <section class="view public-notes-view" id="view-public-notes" data-view="public-notes" hidden>
          <iframe
            class="public-notes-frame"
            id="public-notes-frame"
            src="./public-notes.html?v=2026.9.39"
            title="公共 まとめノート"
            loading="lazy"
          ></iframe>
        </section>

        <!-- 学習を終えた直後の結果。ホームから開く入口は置かない。 -->
        <section class="view result-view" id="view-result" data-view="result" hidden>
          <div id="result-content"></div>
        </section>

        <!-- テストの履歴。押すとその回の結果（間違えた問題・やり直し）を開く。 -->
        <section class="view history-view" id="view-history" data-view="history" hidden>
          <div class="page-heading">
            <p class="eyebrow">HISTORY</p>
            <h1>テストの履歴</h1>
          </div>
          <div class="history-list" id="history-list"></div>
        </section>

        <section class="view settings-view" id="view-settings" data-view="settings" hidden>
          <div class="page-heading">
            <p class="eyebrow">SETTINGS</p>
            <h1>設定</h1>
          </div>
          <div class="settings-grid" id="settings-content"></div>
        </section>

        <section class="view quiz-view" id="view-quiz" data-view="quiz" hidden>
          <div id="quiz-content"></div>
        </section>
      </main>
    </div>

    <div class="fx-vignette" id="fx-vignette" aria-hidden="true"></div>
    <div class="fx-stage" id="fx-stage" aria-hidden="true">
      <span class="fx-light-column" id="fx-light-column"></span>
      <span class="fx-energy-core" id="fx-energy-core"></span>
      <span class="fx-gold-frame" id="fx-gold-frame"></span>
      <span class="fx-crack" id="fx-crack"></span>
    </div>
    <canvas class="effects-canvas" id="effects-canvas" aria-hidden="true"></canvas>
    <div class="fx-invert" id="fx-invert" aria-hidden="true"></div>
    <div class="fx-flash" id="fx-flash" aria-hidden="true"></div>
    <div class="max-callout" id="max-callout" aria-live="polite" hidden></div>

    <div class="onboarding-backdrop" id="onboarding" hidden>
      <section class="onboarding-card" role="dialog" aria-modal="true" aria-labelledby="onboarding-title">
        <div class="onboarding-logo" aria-hidden="true">W</div>
        <p class="eyebrow">WELCOME TO WORDS</p>
        <h1 id="onboarding-title">学習を始めよう</h1>
        <p>正解したときの演出を選んでください。後から設定で変更できます。</p>
        <div class="onboarding-options">
          <button type="button" data-select-effects="simple">
            <span class="onboarding-option-icon">○</span>
            <strong>SIMPLE</strong><small>集中して勉強する</small>
          </button>
          <button type="button" data-select-effects="max" class="max-option">
            <span class="onboarding-option-icon">✦</span>
            <strong>MAX</strong><small>正解するたび超派手な演出</small>
          </button>
        </div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="./src/app.js?v=2026.11.20"></script>
  </body>
</html>
