# Cloudflare Workers へ words MCP Server を置くための設定。
#
#   1. npx wrangler kv namespace create WORDS_KV
#      表示された id を下の kv_namespaces に貼る
#   2. npx wrangler secret put WORDS_OWNER_KEY
#      （管理キー。ここで入力した値はリポジトリには残らない）
#   3. npx wrangler deploy
#
# 秘密（WORDS_OWNER_KEY）は必ず secret として入れること。
# このファイルへ直接書くとGitHubへ公開されてしまう。

name = "words-mcp"
main = "server/adapters/cloudflare.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

[vars]
WORDS_SITE_ORIGIN = "https://hsgwyuki0429-design.github.io/words"
WORDS_ALLOWED_ORIGINS = "https://hsgwyuki0429-design.github.io"

[[kv_namespaces]]
binding = "WORDS_KV"
id = "ee882be240e24dafa3729e2cecbd68c4"
